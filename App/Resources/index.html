<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
/* Dynamic Type: the layout uses fixed px, so the app passes a zoom step for the iOS text size
   (GD_TEXT, and GDtext() when it changes). Zooming the viewport (not pageZoom) makes the page
   re-lay out narrower; it never goes below 335 CSS px wide, the narrowest width it is tested at. */
window.GDtext=function(step){
  step=+step||1; var W=screen.width||375, z=step>1?Math.min(step,Math.max(1,W/335)):step;
  z=Math.round(z*100)/100; window.GDZ=z;
  var m=document.querySelector('meta[name=viewport]'); if(!m) return;
  m.setAttribute('content', z===1?'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover'
    :'width='+Math.round(W/z)+', initial-scale='+z+', minimum-scale='+z+', maximum-scale='+z+', user-scalable=no, viewport-fit=cover');
};
if(window.GD_TEXT) GDtext(window.GD_TEXT);
</script>
<style>
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Glassday Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Non-blocking: first paint never waits on the network; the system fallback fonts show until these arrive (or forever, offline). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-screen phone app — glass header + week strip, scrolling glass card for the active view, floating glass dock with FAB. */
:root{
  --bg:#eceae6; --ink:#16171b; --ink2:#55565e; --ink3:#66666d;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.80); --glass-soft:rgba(255,255,255,.32);
  --stroke:rgba(255,255,255,.85); --hi:rgba(255,255,255,.95); --hair:rgba(22,23,27,.08);
  --accent:#a8834e; --accent2:#7d5f34; --on-accent:#16130d; --accent-ink:#7e623b; --now:#b9473f;
  --blob1:#d9d4cb; --blob2:#c9ced6; --blob3:#e8dcc6; --blob4:#bfc3c9;
  --shadow:0 14px 36px rgba(22,23,27,.10); --shadow-sm:0 4px 14px rgba(22,23,27,.08);
  --f-display:'Bricolage Grotesque',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0b0d; --ink:#f1efea; --ink2:#b3b0a8; --ink3:#75736d;
  --glass:rgba(26,27,31,.55); --glass-strong:rgba(36,37,42,.88); --glass-soft:rgba(40,41,46,.40);
  --stroke:rgba(255,255,255,.09); --hi:rgba(255,255,255,.07); --hair:rgba(255,255,255,.08);
  --accent:#d2b07a; --accent2:#9c7a48; --on-accent:#16130d; --accent-ink:#d2b07a; --now:#e0675e;
  --blob1:#2a2620; --blob2:#1b2029; --blob3:#3a3022; --blob4:#22252b;
  --shadow:0 14px 36px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a0b0d; --ink:#f1efea; --ink2:#b3b0a8; --ink3:#75736d;
  --glass:rgba(26,27,31,.55); --glass-strong:rgba(36,37,42,.88); --glass-soft:rgba(40,41,46,.40);
  --stroke:rgba(255,255,255,.09); --hi:rgba(255,255,255,.07); --hair:rgba(255,255,255,.08);
  --accent:#d2b07a; --accent2:#9c7a48; --on-accent:#16130d; --accent-ink:#d2b07a; --now:#e0675e;
  --blob1:#2a2620; --blob2:#1b2029; --blob3:#3a3022; --blob4:#22252b;
  --shadow:0 14px 36px rgba(0,0,0,.45); --shadow-sm:0 4px 14px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* HIG 44pt minimum hit area for small controls, without changing how they look */
.chk,.cpick,.icon-btn,.date-title button{position:relative}
.chk::after,.cpick::after,.icon-btn::after,.date-title button::after{content:"";position:absolute;inset:min(0px,calc((100% - 44px) / 2))}

/* ambient blobs */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:var(--blob1);left:-20vmax;top:-18vmax}
.bg i:nth-child(2){width:55vmax;height:55vmax;background:var(--blob2);right:-22vmax;top:18vh;animation-duration:28s}
.bg i:nth-child(3){width:50vmax;height:50vmax;background:var(--blob3);left:-10vmax;bottom:-25vmax;animation-duration:32s}
.bg i:nth-child(4){width:30vmax;height:30vmax;background:var(--blob4);right:5vmax;bottom:8vh;animation-duration:25s;opacity:.6}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}

#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{padding-block:14px 10px;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:10px}
.date-title{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5.9vw,30px);letter-spacing:-.025em;line-height:1;display:flex;align-items:baseline;gap:5px;flex:1;min-width:0;white-space:nowrap;margin:0;overflow:hidden}
.date-title .mo{overflow:hidden;text-overflow:ellipsis;min-width:0}
.date-title .acc{color:var(--accent-ink);font-weight:650}
.date-title button{color:var(--accent-ink);display:inline-grid;place-items:center;transform:translateY(3px);transition:transform .2s}
.date-title button:active{transform:translateY(3px) scale(.85)}
.ring{width:44px;height:44px;position:relative;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;border-radius:50%}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .t{stroke:var(--hair)} .ring .p{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.wk-nav{display:flex;gap:0;flex:none}
.wk-nav .icon-btn{width:30px}
.icon-btn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.88);background:var(--glass-soft)}

.strip{position:relative;display:grid;grid-template-columns:repeat(7,1fr);padding:8px 4px;border-radius:24px;touch-action:pan-y}
.wbub{position:absolute;top:6px;bottom:6px;left:calc(4px + var(--i) * (100% - 8px) / 7);width:calc((100% - 8px) / 7);
  border-radius:18px;background:var(--glass-strong);box-shadow:var(--shadow-sm);transition:left .45s cubic-bezier(.3,1.4,.5,1)}
.wd{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0}
.wd .dn{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.wd .n{font-family:var(--f-display);font-weight:650;font-size:17px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;transition:background .3s,color .3s}
.wd.today .n{background:var(--accent);color:var(--on-accent)}
.wd.sel .dn{color:var(--ink)}
.dots{display:flex;gap:2px;height:6px}
.dots b{width:6px;height:6px;border-radius:50%}

/* main view */
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));scrollbar-width:none;overscroll-behavior:contain}
#view::-webkit-scrollbar{display:none}
.card{border-radius:30px;padding:16px}
.slide-l{animation:slideL .42s cubic-bezier(.2,.8,.2,1)} .slide-r{animation:slideR .42s cubic-bezier(.2,.8,.2,1)} .fade{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(40px)}} @keyframes slideR{from{opacity:0;transform:translateX(-40px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
#view.still :is(.tl-row,.wb,.wbar,.mbar,.mc,.item,.adc,.ym,.bars i,.primer,.fade,.agenda){animation:none}
.stack{display:flex;flex-direction:column;gap:14px}
.h2{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 2px 0}
.label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 4px}
.muted{color:var(--ink2);font-size:13.5px;line-height:1.5}

/* quick to-dos */
.quick{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:4px;border-bottom:1px solid var(--hair);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qb{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.qb .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--on,#fff);background:var(--c);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 45%,transparent);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.qb:active .c{transform:scale(.86)}
.qb.gone{animation:gone .45s forwards}
@keyframes gone{to{opacity:0;transform:scale(.4) translateY(-10px)}}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--glass-soft);font-size:12.5px;color:var(--ink2);margin:12px 0 0}
.banner button{margin-left:auto;font-weight:700;color:var(--accent-ink);white-space:nowrap}
.primer{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--stroke);margin:12px 0 0;animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}
.primer .pi{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--on-accent);background:var(--accent)}
.primer b{font-family:var(--f-display);font-size:16px}
.primer p{margin:4px 0 10px;font-size:13px;line-height:1.45;color:var(--ink2)}
.primer .pa{display:flex;gap:8px;align-items:center}

/* timeline */
.tl{position:relative;padding-top:12px}
.tl::before{content:"";position:absolute;left:83px;top:20px;bottom:20px;width:2px;background:var(--hair);border-radius:2px}
.tl-row{position:relative;display:grid;grid-template-columns:44px 56px minmax(0,1fr) 34px;column-gap:12px;align-items:center;padding-block:5px;
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.tl-time{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-block:4px}
.tl-pill{position:relative;width:56px;border-radius:28px;background:var(--c);color:var(--on,#fff);display:grid;place-items:center;overflow:hidden;
  box-shadow:0 8px 20px color-mix(in srgb,var(--c) 42%,transparent);transition:transform .25s cubic-bezier(.3,1.5,.5,1),filter .3s,opacity .3s}
.tl-pill:active{transform:scale(.92)}
.tl-pill::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.tl-pill .elapsed{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.16);transition:height 1s linear}
.tl-pill.live{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 8px 30px color-mix(in srgb,var(--c) 70%,transparent)}}
.tl-pill svg{position:relative;z-index:1}
.tl-row.done .tl-pill{filter:saturate(.35);opacity:.55}
.tl-body{min-width:0;text-align:left;padding-block:4px}
.tl-body .meta{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-body .meta .live-t{color:var(--now);font-weight:700}
.tl-body .ttl{font-family:var(--f-display);font-weight:650;font-size:17px;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere;transition:color .3s}
.tl-row.done .ttl{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:2px}
.tl-body .rep{font-size:11px;color:var(--ink3);margin-top:2px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:var(--on,#fff);transition:background .25s,transform .25s}
.chk svg{opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.8,.5,1)}
.done .chk,.chk.on{background:var(--c)} .done .chk svg,.chk.on svg{opacity:1;transform:none}
.chk.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.3)}}
.now{position:absolute;left:0;right:0;height:0;z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:48px;right:0;border-top:2px solid var(--now);opacity:.75}
.now::after{content:"";position:absolute;left:44px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
/* inside a live task row, stop the line at the pill so it never strikes through the task text */
.tl-row .now::before{right:auto;width:68px}
.now span{position:absolute;left:0;top:-9px;font-size:11.5px;font-weight:800;color:var(--now);font-variant-numeric:tabular-nums}
.tl-gap{position:relative;display:grid;grid-template-columns:44px 56px minmax(0,1fr);column-gap:12px;min-height:16px;align-items:center}
.tl-gap.big{min-height:46px}
.free{grid-column:3;justify-self:start;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px dashed var(--hair);color:var(--ink3);font-size:12.5px;font-weight:600;transition:all .2s}
.free:hover,.free:active{border-color:var(--accent);color:var(--accent-ink);background:var(--glass-soft)}
.empty{text-align:center;padding:36px 12px 26px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .big{font-family:var(--f-display);font-weight:800;font-size:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:700;background:var(--accent);color:var(--on-accent);
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--glass-soft);color:var(--ink);box-shadow:none;border:1px solid var(--stroke)}
.btn.danger{background:#d9534f;box-shadow:none}
.btn.sm{padding:8px 12px;border-radius:12px;font-size:13px}

/* week */
.wk{position:relative;padding:12px 8px 8px}
.wk-top{position:sticky;top:0;z-index:4;margin:0 -8px 6px;padding:6px 8px;border-radius:18px;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wk-head{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:2px}
.wk-ad{display:flex;gap:2px;margin-top:6px;padding-top:6px;border-top:1px solid var(--hair)}
.wk-adl{width:34px;flex:none;font-size:9px;font-weight:700;line-height:1.1;color:var(--ink3);text-align:right;padding:2px 4px 0 0;text-transform:uppercase;letter-spacing:.03em}
.wk-adb{position:relative;flex:1;min-width:0}
.wbar{position:absolute;height:18px;border-radius:6px;background:var(--c);color:var(--on,#fff);font-size:10px;font-weight:700;padding:0 6px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;
  box-shadow:0 3px 8px color-mix(in srgb,var(--c) 35%,transparent);animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.wk-head>*{text-align:center;padding:2px 0;border-radius:12px;transition:background .3s;font-size:11px;color:var(--ink3);font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.wk-head b{font-family:var(--f-display);font-size:15px;color:var(--ink);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.wk-head .t b{background:var(--accent);color:var(--on-accent)}
.wk-head .s{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.wk-head .s span{color:var(--accent-ink);font-weight:800}
.wk-head .s:not(.t) b{box-shadow:0 0 0 2px var(--accent);color:var(--accent-ink)}
.wk-body{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:2px;position:relative}
.wk-hours{position:relative}
.wk-hours span{position:absolute;right:4px;font-size:10px;color:var(--ink3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk-col{position:relative;border-radius:10px;cursor:copy}
.wk-col.t{background:var(--glass-soft)}
.wk-col.s{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent);animation:colPick .55s cubic-bezier(.2,.8,.2,1)}
@keyframes colPick{from{background:color-mix(in srgb,var(--accent) 32%,transparent);box-shadow:inset 0 0 0 3px var(--accent)}}
.wk-lines{position:absolute;left:34px;right:0;top:0;pointer-events:none}
.wk-lines i{position:absolute;left:0;right:0;border-top:1px solid var(--hair)}
.wb{position:absolute;border-radius:8px;padding:4px 5px;font-size:10.5px;font-weight:700;line-height:1.15;color:var(--on,#fff);background:var(--c);overflow:hidden;text-align:left;
  box-shadow:0 3px 10px color-mix(in srgb,var(--c) 40%,transparent);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n) * 25ms);transition:transform .2s}
.wb:active{transform:scale(.95)}
.wb.done{opacity:.45;text-decoration:line-through}
.wb small{display:block;font-weight:500;opacity:.85;font-size:9.5px}
.wk-now{position:absolute;left:0;right:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--glass-soft);border:1px solid var(--stroke);animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n) * 35ms)}
.item .ic{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--on,#fff);background:var(--c)}
.item .tx{flex:1;min-width:0;text-align:left}
.item .tx b{display:block;font-weight:700;overflow-wrap:anywhere}
.item .tx small{color:var(--ink2);font-size:12px}
.item.done{opacity:.55} .item.done .tx b{text-decoration:line-through}
.pill-btn{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--glass-strong);border:1px solid var(--stroke);white-space:nowrap;transition:transform .15s}
.pill-btn:active{transform:scale(.92)}
.inline-add{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--stroke)}
.inline-add input{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 0}

/* smart */
.smart-in{display:flex;flex-direction:column;gap:10px}
.smart-box{display:flex;gap:8px;align-items:flex-end;padding:10px 10px 10px 16px;border-radius:24px;background:var(--glass-strong);border:1px solid var(--stroke);box-shadow:var(--shadow-sm)}
.smart-box textarea{flex:1;min-width:0;border:0;background:none;outline:none;resize:none;min-height:46px;padding:6px 0;line-height:1.4}
.send{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none;transition:transform .2s}
.send:active{transform:scale(.88) rotate(-8deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.sp-pill:nth-of-type(4){height:24px;background:#7BB662;animation-delay:.45s}
.sp-now{position:absolute;left:4px;right:4px;top:66px;height:4px;border-radius:4px;background:#d2b07a;transform:scaleX(0);transform-origin:left;
  box-shadow:0 0 14px rgba(210,176,122,.7);animation:spSweep .55s .8s cubic-bezier(.6,0,.2,1) forwards}
.sp-now::before{content:"";position:absolute;left:-6px;top:-5px;width:14px;height:14px;border-radius:50%;background:#d2b07a}
.sp-word{font-family:var(--f-display);font-weight:800;font-size:38px;letter-spacing:-.03em;display:flex}
.sp-word span{display:inline-block;opacity:0;transform:translateY(18px);animation:spRise .5s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(1s + var(--i) * 45ms)}
.sp-word span.g{color:#d2b07a}
.sp-tag{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,239,231,.55);opacity:0;animation:spFade .5s 1.25s ease forwards;margin-top:-14px}
@keyframes spGlow{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes spRail{to{transform:scaleY(1)}}
@keyframes spDrop{to{opacity:1;transform:none}}
@keyframes spSweep{to{transform:scaleX(1)}}
@keyframes spRise{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
#app.entering,.dock.entering{animation:appIn .7s cubic-bezier(.2,.8,.2,1) both}
.dock.entering{animation-delay:.12s}
@keyframes appIn{from{opacity:0;transform:scale(.96) translateY(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>
(()=>{

 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', tick:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>', play:'<path d="M7 4.5v15l12-7.5z"/>', pause:'<path d="M8 5v14M16 5v14"/>',
 send:'<path d="M5 12h14M13 6l6 6-6 6"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'
};
const ic=(n,s=22,w=2)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.star}</svg>`;
const TASK_ICONS=['alarm','coffee','book','code','laptop','camera','video','dumbbell','bike','car','food','drop','moon','phone','users','cart','heart','music','sun','task','star'];
const OLD_COLORS=['#B4846C','#56677E','#232C3A','#6B2E39','#7E8C6E','#B08F58','#5E4E6E','#3D6965'];
const COLORS=['#F08A7E','#5B7DB1','#2E4A6B','#8F3F65','#7BB662','#EFA92E','#8E7FE6','#33A6A0'];
const COLOR_NAMES=['Coral','Blue','Navy','Plum','Green','Amber','Violet','Teal'];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const dow=k=>pd(k).getDay();
const today=()=>dk(new Date());
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fT=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const fD=m=>m<60?`${m} min`:(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const weekStart=k=>addD(k,-((dow(k)+6)%7));
/* text/glyph colour on a task colour: white unless it falls below 3.5:1 (WCAG wants 3:1 for
   glyphs, 4.5:1 for small text), then near-black. Also applies to Apple Calendar colours. */
const lum=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||''); if(!m)return .2; const n=parseInt(m[1],16);
  return [n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)};
const onC=h=>1.05/(lum(h)+.05)<3.5?'#16171b':'#fff';
const cv=h=>`--c:${h};--on:${onC(h)}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.gd);
const post=m=>{try{window.webkit.messageHandlers.gd.postMessage(m)}catch(e){}};
const NAT={access:NATIVE?'pending':'web',cals:[],defCal:null,loaded:null,reqKey:null,saves:{},dirty:false};
const LIVE=()=>NATIVE&&NAT.access==='granted';

/* ---------- state ---------- */
const LS='glassday.v1';
function seed(){
  const T=today(), tom=addD(T,1), ws=weekStart(T), sat=addD(ws,5), sun=addD(ws,6);
  const t=(title,icon,c,date,start,dur,repeat='none')=>({id:uid(),title,icon,color:COLORS[c],date,start,dur,repeat,done:{},notes:'',sample:true});
  const all=[
    t('Rise and Shine','alarm',0,T,450,15,'daily'),
    t('Morning coffee','coffee',3,T,465,15,'daily'),
    t('Lecture','book',1,T,540,120,'weekdays'),
    t('Lunch break','food',5,T,750,45,'weekdays'),
    t('Coursework session','code',6,T,840,120),
    t('Gym','dumbbell',4,T,1050,60),
    t('Dinner','food',7,T,1170,60,'daily'),
    t('Wind down','moon',2,T,1380,30,'daily'),
    t('Study group','users',6,tom,900,90),
    t('Photo shoot','camera',5,sat,600,180),
    t('Edit client video','video',3,sun,840,150),
    t('Call Mum','phone',4,null,null,15),
    t('Plan tomorrow','task',0,null,null,15),
    t('Book vacation','sun',5,null,null,30),
    t('Buy groceries','cart',7,null,null,45),
  ];
  const ad=(title,icon,c,date,endDate)=>({id:uid(),title,icon,color:COLORS[c],date,endDate,start:null,dur:30,repeat:'none',allDay:true,done:{},notes:'',sample:true});
  all.push(ad('Assignment due','book',0,tom,tom), ad('Penang trip','sun',5,addD(ws,4),sun));
  return {settings:{theme:'system',dayStart:6,dayEnd:24},tasks:NATIVE?all.filter(x=>!x.date):all};
}
let S;
try{S=JSON.parse(NATIVE?(window.GD_SAVED||'null'):localStorage.getItem(LS))}catch(e){}
if(NATIVE&&!S){try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}}
if(!S||!Array.isArray(S.tasks))S=seed();
S.tasks.forEach(t=>{const i=OLD_COLORS.indexOf(t.color);if(i>=0)t.color=COLORS[i]});
S.settings=Object.assign({theme:'system',dayStart:6,dayEnd:24},S.settings||{});
S.meta=S.meta||{}; S.doneN=S.doneN||{}; S.allDay=[]; S.tasks=S.tasks.filter(t=>!t.ext&&!t.pend);
// One store per mode: UserDefaults (via persist) in the app, localStorage in a browser.
// (The app still reads localStorage once above, to migrate data from older builds.)
const save=()=>{const data=JSON.stringify({settings:S.settings,tasks:S.tasks.filter(t=>!t.ext&&!t.pend),meta:S.meta,doneN:S.doneN});
  if(NATIVE) post({type:'persist',data}); else try{localStorage.setItem(LS,data)}catch(e){} };
let sel=today(), view='timeline', draft=null, undoFn=null, lastDir='', calMode=S.settings.calMode||'month';

function ruleHit(t,k){
  if(k<t.date)return false;
  if(t.until&&k>t.until)return false;
  if(t.skip&&t.skip[k])return false;
  switch(t.repeat){
    case 'daily': return true;
    case 'weekdays': {const w=dow(k);return w>0&&w<6}
    case 'weekly': return dow(k)===dow(t.date);
    case 'monthly': return pd(k).getDate()===pd(t.date).getDate();
    case 'yearly': {const a=pd(k),b=pd(t.date);return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()}
    default: return k===t.date;
  }
}
function occurs(t,k){ return !!t.date&&t.start!=null&&!t.allDay&&ruleHit(t,k) }
const isRep=t=>t&&(t.ext?(t.rep&&t.rep!=='none'):(t.repeat&&t.repeat!=='none'));
const isDone=(t,k)=>t.ext?!!S.doneN[t.series+'|'+t.date]:t.allDay?!!(t.done&&t.done[t.date]):!!(t.done&&t.done[k||'inbox']);
const adEnd=a=>a.endDate||a.date;
const dBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
// all-day items overlapping [from,to], with repeating local ones expanded into occurrences
function allDayItems(from,to){
  const out=S.allDay.filter(a=>a.date<=to&&adEnd(a)>=from);
  for(const t of S.tasks){
    if(!t.allDay||!t.date) continue;
    const span=Math.max(0,dBetween(t.date,adEnd(t)));
    if(!t.repeat||t.repeat==='none'){ if(t.date<=to&&adEnd(t)>=from) out.push(t); continue }
    t.done=t.done||{};
    let k=addD(from,-span); if(k<t.date) k=t.date;
    for(;k<=to;k=addD(k,1)) if(ruleHit(t,k)) out.push(k===t.date?t:Object.assign({},t,{id:t.id+'~'+k,date:k,endDate:addD(k,span),baseId:t.id}));
  }
  return out;
}
const allDayOn=k=>allDayItems(k,k);
function packSegs(ws,we){
  const its=allDayItems(ws,we)
    .sort((a,b)=>a.date.localeCompare(b.date)||dBetween(b.date,adEnd(b))-dBetween(a.date,adEnd(a)));
  const lanes=[];
  return its.map(a=>{const s0=a.date<ws?ws:a.date, e0=adEnd(a)>we?we:adEnd(a), c0=dBetween(ws,s0), c1=dBetween(ws,e0);
    let l=lanes.findIndex(x=>x<c0); if(l<0){l=lanes.length;lanes.push(-1)} lanes[l]=c1;
    return {a,c0,c1,lane:l,cs:a.date<ws,ce:adEnd(a)>we}});
}
function fmtRange(a,b){const f=k=>`${DN[dow(k)]} ${pd(k).getDate()} ${MON[pd(k).getMonth()].slice(0,3)}`; return !b||a===b?f(a):`${f(a)} – ${f(b)}`}
function adLabel(a,k){
  const n=dBetween(a.date,adEnd(a))+1;
  if(a.timedSpan) return `${fT(a.start)} ${DN[dow(a.date)]} → ${DN[dow(adEnd(a))]} ${pd(adEnd(a)).getDate()}`;
  const r=a.ext?a.rep:a.repeat, rl=r&&r!=='none'?` · ↻ ${repLabel[r]||'Repeats'}`:'';
  return (n===1?'All day':`All day · day ${dBetween(a.date,k)+1} of ${n}`)+rl;
}
function removeTask(t){[S.tasks,S.allDay].forEach(arr=>{const i=arr.indexOf(t); if(i>=0) arr.splice(i,1)})}
const dayTasks=k=>S.tasks.filter(t=>occurs(t,k)).sort((a,b)=>a.start-b.start||a.dur-b.dur);
const inbox=()=>S.tasks.filter(t=>!t.date);
const byId=id=>{
  const t=S.tasks.find(x=>x.id===id)||S.allDay.find(x=>x.id===id); if(t||!id) return t;
  const i=id.indexOf('~'); if(i<0) return null;
  const b=S.tasks.find(x=>x.id===id.slice(0,i)); if(!b) return null;
  const k=id.slice(i+1); return Object.assign({},b,{id,date:k,endDate:addD(k,dBetween(b.date,adEnd(b))),baseId:b.id});
};
let editOcc=null;
const repLabel={none:'',daily:'Every day',weekdays:'Weekdays',weekly:'Every week',monthly:'Every month',yearly:'Every year',custom:'Repeats'};

function freeSlots(k,from){
  const ds=S.settings.dayStart*60, de=S.settings.dayEnd*60;
  let cur=Math.max(ds,from??ds); const out=[];
  for(const t of dayTasks(k)){ if(t.start>cur)out.push([cur,t.start]); cur=Math.max(cur,t.start+t.dur) }
  if(de>cur)out.push([cur,de]);
  return out.filter(([a,b])=>b-a>=15);
}
function firstFree(k,dur){
  const from=k===today()?Math.ceil((nowM()+5)/15)*15:null;
  for(const [a,b] of freeSlots(k,from)) if(b-a>=dur) return a;
  return null;
}
function overlaps(t,k){
  return dayTasks(k).filter(o=>o.id!==t.id&&o.start<t.start+t.dur&&t.start<o.start+o.dur);
}

/* ---------- theme ---------- */
const PAL={

   L:{bg:'#f3ebe8',accent:'#b76e79',accent2:'#8c4f58',on:'#1a0f12',ink:'#a2505d',b:['#f1cfd3','#e8d6cf','#f6e1d8','#d9c4c8']},
   D:{bg:'#120c0e',accent:'#e5a1aa',accent2:'#a86a73',on:'#1a0f12',b:['#3d1f27','#2a1b1f','#4a2a2c','#221a1d']}},
 emerald:{name:'Emerald',sw:['#2f7d62','#c6ddd1','#10352a'],
   L:{bg:'#e8eeea',accent:'#2f7d62',accent2:'#1f5a46',on:'#fff',ink:'#2c765c',b:['#c6ddd1','#d6e4dc','#e3ead1','#bdd3cc']},
   D:{bg:'#08110d',accent:'#5cc49b',accent2:'#2f8a69',on:'#04130c',b:['#10352a','#152a24','#2a3a1f','#0f2420']}},
 sapphire:{name:'Sapphire',sw:['#3756a8','#c9d4ef','#1a2756'],
   L:{bg:'#e8ecf3',accent:'#3756a8',accent2:'#233c80',on:'#fff',b:['#c9d4ef','#d7def0','#dfe0f5','#bfcde3']},
   D:{bg:'#070a14',accent:'#7c9cff',accent2:'#4d68c9',on:'#0a0f22',b:['#1a2756','#141c3a','#2a2257','#0f1a33']}},
 lavender:{name:'Lavender',sw:['#7a5cc4','#ddd0f5','#2e2155'],

const buzz=p=>{if(NATIVE){post({type:'haptic',style:Array.isArray(p)?'success':(p>=20?'medium':'light')});return} try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(el,color){
  if(reduce||!el)return; const r=el.getBoundingClientRect(), fx=document.getElementById('fx');
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=[color,'#d2b07a','#e9dfc9','#a8834e','#8a8f98'];
  for(let i=0;i<14;i++){
    const p=document.createElement('i'); const a=Math.random()*Math.PI*2, d=30+Math.random()*44;
    p.style.cssText=`left:${cx-4}px;top:${cy-4}px;background:${cols[i%cols.length]}`; fx.appendChild(p);
    p.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*360}deg) scale(.4)`,opacity:0}],
      {duration:650+Math.random()*300,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>p.remove();
  }
}

/* ---------- smart parser ---------- */
const KW=[[/gym|workout|run|exercise|yoga|training/,'dumbbell',4],[/study|lecture|class|revise|exam|read|tutorial|lab/,'book',1],[/code|assignment|coursework|project|program/,'code',6],
 [/shoot|photo/,'camera',5],[/edit|video|film|vlog/,'video',3],[/call|phone|ring/,'phone',4],[/meet|group|friends|date/,'users',7],[/lunch|dinner|breakfast|eat|food|brunch/,'food',5],
 [/coffee|tea/,'coffee',3],[/shop|buy|groceries|grocery/,'cart',7],[/sleep|bed|wind down|nap/,'moon',2],[/drive|car|pick up/,'car',2],[/bike|cycle/,'bike',4],[/shower|bath/,'drop',2],
 [/music|guitar|piano|practice/,'music',6],[/wake|alarm|rise/,'alarm',0],[/bill|pay|bank/,'task',0],[/trip|vacation|holiday|travel|flight/,'sun',5],[/work|laptop|email/,'laptop',1],[/mum|mom|dad|family|love/,'heart',0]];
function guess(title){const s=title.toLowerCase(); for(const[r,i,c] of KW) if(r.test(s)) return {icon:i,color:COLORS[c]}; return {icon:'star',color:COLORS[6]}}
const DAYRE='(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(?:day|nesday|sday|urday|rsday)?';
function parse(text){
  let s=' '+text.trim()+' '; const T=today(); let date=null,start=null,dur=null,repeat='none';
  const cut=re=>{const m=s.match(re); if(m) s=s.replace(m[0],' '); return m};
  const dayIdx=w=>['sun','mon','tue','wed','thu','fri','sat'].indexOf(w.slice(0,3).toLowerCase());
  const nextDow=(i,forceNext)=>{let d=(i-dow(T)+7)%7; if(d===0&&forceNext)d=7; return addD(T,d)};
  let m;
  if(cut(/\b(every ?day|daily)\b/i)) repeat='daily';
  else if(cut(/\b(every )?weekdays?\b/i)) repeat='weekdays';
  else if(m=cut(new RegExp('\\bevery '+DAYRE+'\\b','i'))){repeat='weekly';date=nextDow(dayIdx(m[1]))}
  else if(cut(/\b(every ?month|monthly)\b/i)) repeat='monthly';
  else if(cut(/\b(every ?year|yearly|annually)\b/i)) repeat='yearly';
  else if(cut(/\bweekly\b/i)) repeat='weekly';
  let allDay=false, endDate=null, nDays=0;
  if(cut(/\b(all[- ]day|whole day|full day)\b/i)) allDay=true;
  if(m=cut(new RegExp('\\b(?:from )?'+DAYRE+'\\s*(?:-|–|to|until|till)\\s*'+DAYRE+'\\b','i'))){date=nextDow(dayIdx(m[1])); let e=nextDow(dayIdx(m[2])); if(e<date)e=addD(e,7); endDate=e; allDay=true}
  else if(m=cut(/\b(\d{1,2})[\/-](\d{1,2})\s*(?:-|–|to|until|till)\s*(\d{1,2})[\/-](\d{1,2})\b/)){const y=pd(T).getFullYear(); let a=new Date(y,+m[2]-1,+m[1]); if(dk(a)<T)a=new Date(y+1,+m[2]-1,+m[1]); let b=new Date(a.getFullYear(),+m[4]-1,+m[3]); if(b<a)b=new Date(a.getFullYear()+1,+m[4]-1,+m[3]); date=dk(a); endDate=dk(b); allDay=true}
  if(m=cut(/\bfor (\d+) days\b/i)){nDays=+m[1]; allDay=true}
  if(m=cut(/\b(\d{1,2})h(\d{2})\b/i)) dur=+m[1]*60+ +m[2];
  if(m=cut(/\b(?:at\s*)?(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/i)){let h=+m[1]%12; if(m[3].toLowerCase()==='pm')h+=12; start=h*60+(+m[2]||0)}
  else if(m=cut(/\b(?:at\s*)?([01]?\d|2[0-3])[:.]([0-5]\d)\b/i)) start=+m[1]*60+ +m[2];
  if(dur==null&&(m=cut(/\b(?:for\s*)?(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minutes)\b/i))) dur=Math.round(+m[1]*(/^h/i.test(m[2])?60:1));
  if(m=cut(/\b(today)\b/i)) date=T;
  else if(m=cut(/\btonight\b/i)){date=T; if(start==null)start=20*60}
  else if(cut(/\b(tomorrow|tmr|tmrw|tomoro)\b/i)) date=addD(T,1);
  else if(m=cut(/\bin (\d+) days?\b/i)) date=addD(T,+m[1]);
  else if(m=cut(/\b(\d{1,2})[\/-](\d{1,2})\b/)){const y=pd(T).getFullYear(); let d=new Date(y,+m[2]-1,+m[1]); if(dk(d)<T)d=new Date(y+1,+m[2]-1,+m[1]); date=dk(d)}
  else if(date==null&&(m=cut(new RegExp('\\b(next |this |on )?'+DAYRE+'\\b','i')))) date=nextDow(dayIdx(m[2]),/next/i.test(m[1]||''));
  if(start==null&&(m=cut(/\bat (\d{1,2})\b/i))){let h=+m[1]; if(h<8)h+=12; start=h*60}
  if(start==null){const tw={morning:9*60,noon:12*60,afternoon:14*60,evening:18*60,night:20*60}; for(const w in tw) if(cut(new RegExp('\\b(in the |this )?'+w+'\\b','i'))){start=tw[w]; break}}
  if(start!=null&&!date) date=sel;
  if(allDay){ if(!date) date=sel; endDate=nDays>1?addD(date,nDays-1):(endDate||date); start=null }
  if(repeat!=='none'&&!date) date=T;
  let title=s.replace(/\s+/g,' ').trim().replace(/^(to|on|at|for|in)\s+/i,'').replace(/\s+(on|at|for|in|by)$/i,'').trim();
  if(!title) title='New task';
  title=title[0].toUpperCase()+title.slice(1);
  return {title,date,start,dur:dur||(start!=null?60:30),repeat,allDay,endDate,...guess(title)};
}
function pvHtml(p){

  return `<div class="preview" style="${cv(p.color)}"><span class="ic">${ic(p.icon,24)}</span><div style="flex:1;min-width:0"><b style="display:block;overflow-wrap:anywhere">${esc(p.title)}</b><small class="muted num">${when}${p.repeat!=='none'?' · ↻ '+repLabel[p.repeat]:''}</small></div>
    <div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" data-act="pv-add">Add</button><button class="pill-btn" data-act="pv-edit">Edit</button></div></div>`;
}
function commitParsed(p){

}
function pushNative(t,o={}){

  post({type:'upsert',reqId:req,series:o.series||null,occDate:o.occDate||null,title:t.title,date:t.date,allDay:!!t.allDay,endDate:t.allDay?(t.endDate||t.date):null,start:t.start,dur:t.dur,repeat:t.repeat||'none',notes:t.notes||'',calId:t.calId||S.settings.calId||null});
}
function ensureRange(){
  if(!LIVE())return;
  const y=pd(sel).getFullYear(), yr=view==='week'&&calMode==='year';
  const a=yr?`${y}-01-01`:addD(sel,-40), b=yr?`${y}-12-31`:addD(sel,45);

  let from=addD(sel,-60), to=addD(sel,100); if(a<from)from=a; if(b>to)to=b;
  if(NAT.reqKey===from+to)return; NAT.reqKey=from+to; post({type:'load',from,to});
}
function softRender(){ if(document.getElementById('sheet').classList.contains('open')||document.getElementById('focus').classList.contains('open')){NAT.dirty=true;return} render() }
window.GDN={
  access(s){NAT.access=s; if(s==='granted'){NAT.reqKey=null;NAT.loaded=null} softRender()},
  calendars(list,def){NAT.cals=list||[];NAT.defCal=def; if(!S.settings.calId||!NAT.cals.some(c=>c.id===S.settings.calId)){S.settings.calId=def;save()} softRender()},
  events(list,from,to){

        icon:m.icon||g.icon,color:m.color||e.color||g.color,notes:e.notes||'',cal:e.cal,calId:e.calId,editable:!!e.editable,done:{}}});

      return {id:'AD:'+e.series+'@'+e.date,series:e.series,ext:true,allDay:true,timedSpan:!e.allDay,title:e.title||'(No title)',date:e.date,endDate:e.endDate||e.date,
        start:e.allDay?null:e.start,dur:e.dur||30,repeat:'none',rep:e.rep||'none',icon:m.icon||g.icon,color:m.color||e.color||g.color,notes:e.notes||'',cal:e.cal,calId:e.calId,
        editable:!!e.editable&&!!e.allDay,done:{}}}).filter(a=>!seen.has(a.id)&&seen.add(a.id));
    softRender();

  notice(msg){ if(!this._noticed){this._noticed=true; toast(String(msg||''))} },   // once per session
  openDay(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||dk(pd(k))!==k)return; closeSheet(); sel=k; view='timeline'; render('fade'); setTimeout(scrollToNow,80)}
};

/* ---------- plan ---------- */
function autoPlan(){
  const k=sel, todo=inbox().filter(t=>!isDone(t)).sort((a,b)=>a.dur-b.dur); let n=0; const moved=[];
  for(const t of todo){
    const s=firstFreeBuffered(k,t.dur); if(s==null)continue;
    moved.push([t,{date:t.date,start:t.start}]); t.date=k; t.start=s; t.repeat='none'; n++;
  }
  if(LIVE()&&n){moved.forEach(([t])=>{pushNative(t);t.pend=true}); save(); render('fade'); toast(`Placed ${n} to-do${n>1?'s':''} into Apple Calendar`); buzz([8,40,8]); return}
  save(); render('fade');
  if(n) toast(`Placed ${n} to-do${n>1?'s':''} into ${k===today()?'today':DN[dow(k)]}`,()=>{moved.forEach(([t,o])=>{t.date=o.date;t.start=o.start});save();render()});
  else toast(todo.length?'Not enough free time left that day':'Your inbox is empty');
  buzz([8,40,8]);
}
function firstFreeBuffered(k,dur){
  const from=k===today()?Math.ceil((nowM()+5)/15)*15:null;
  for(const [a,b] of freeSlots(k,from)){const st=a===(from??S.settings.dayStart*60)?a:Math.ceil((a+10)/5)*5; if(b-st>=dur+ (b===S.settings.dayEnd*60?0:10)) return st}
  return null;
}

      const isNew=draft._new; delete draft._new; delete draft.sample;
      const o=draft.date&&!draft.allDay?overlaps(draft,draft.date):[];
      if(isNew) S.tasks.push(draft); else { const i=S.tasks.findIndex(x=>x.id===draft.id); if(i>=0) S.tasks[i]=draft }
      const d=draft; save(); closeSheet(); if(d.date&&d.date!==sel&&view==='timeline'){lastDir=d.date>sel?'slide-l':'slide-r'; sel=d.date; render(lastDir)} else render();
      toast(o.length?`Saved — overlaps ${o[0].title}`:isNew?(d.allDay?`Added all-day · ${fmtRange(d.date,d.endDate)}`:d.date?`Added for ${fT(d.start)}`:'Added to Inbox'):'Saved'); buzz([10,30,15]); break; }
    case 'del': if(isRep(draft)&&!(draft.ext&&!draft.editable)){
      const f=sheet.querySelector('.sheet-foot'); f.dataset.prev=f.innerHTML;
      const when=editOcc?fmtRange(editOcc):'';
      f.innerHTML=`<div class="delopts"><p>Delete a repeating ${draft.ext?'event':'task'}${when?` · ${when}`:''}</p>
        <button class="btn ghost" data-act="del-one">This one only</button>
        <button class="btn ghost" data-act="del-future">This and all future ones</button>
        <button class="btn danger" data-act="del-all">All of them</button>
        <button class="pill-btn" data-act="del-cancel">Cancel</button></div>`; buzz(20); break }
      document.getElementById('del-wrap').innerHTML=`<button class="btn danger" style="flex:1" data-act="del-yes">${draft.ext?(draft.rep!=='none'?'Delete this & future':'Delete event'):(draft.repeat!=='none'?'Delete all repeats':'Confirm delete')}</button>`; buzz(20); break;
    case 'del-cancel': { const f=sheet.querySelector('.sheet-foot'); if(f&&f.dataset.prev!=null) f.innerHTML=f.dataset.prev; break }
    case 'del-one': case 'del-future': case 'del-all': {
      const mode=act.slice(4), d=draft;
      if(d.ext){
        const orig=byId(d.id)||d, occ=orig.date;
        post({type:'delete',series:d.series,occDate:occ,span:mode==='one'?'one':mode==='future'?'future':'all'});
        if(mode==='one') removeTask(orig);
        else [S.tasks,S.allDay].forEach(arr=>{for(let j=arr.length-1;j>=0;j--){const x=arr[j]; if(x.series===d.series&&(mode==='all'||x.date>=occ)) arr.splice(j,1)}});
        closeSheet(); render(); toast(mode==='one'?'Deleted this one from Apple Calendar':mode==='future'?'Deleted this and future ones':'Deleted every repeat'); buzz(20); break;
      }
      const base=S.tasks.find(x=>x.id===d.id); if(!base){closeSheet();break}
      const occ=editOcc||base.date, snap=JSON.parse(JSON.stringify(base)), idx=S.tasks.indexOf(base);
      if(mode==='all'||(mode==='future'&&occ<=base.date)) S.tasks.splice(idx,1);
      else if(mode==='future') base.until=addD(occ,-1);
      else { base.skip=Object.assign({},base.skip,{[occ]:true}); if(!S.tasks.some(x=>x===base)) S.tasks.push(base) }
      save(); closeSheet(); render();
      toast(mode==='one'?`Deleted ${fmtRange(occ)} only`:mode==='future'?`Deleted from ${fmtRange(occ)} onwards`:`Deleted every repeat of ${snap.title}`,
        ()=>{const j=S.tasks.findIndex(x=>x.id===snap.id); if(j>=0) S.tasks[j]=snap; else S.tasks.splice(Math.min(idx,S.tasks.length),0,snap); save(); render()});
      buzz(20); break; }
    case 'del-yes': { const old=byId(draft.id), i=S.tasks.indexOf(old);
      if(old&&old.ext){ post({type:'delete',series:old.series,occDate:old.date,span:old.rep!=='none'?'future':'one'}); removeTask(old); closeSheet(); render(); toast('Deleted from Apple Calendar'); buzz(20); break } if(i>=0){S.tasks.splice(i,1); save(); closeSheet(); render(); toast(`Deleted ${old.title}`,()=>{S.tasks.splice(i,0,old);save();render()})} break; }
    case 'undo': if(undoFn){undoFn(); undoFn=null; document.getElementById('toast').classList.remove('show')} break;
    case 'theme': S.settings.theme=a.dataset.v; applyTheme(); save(); render(); break;
    case 'palette': S.settings.palette=a.dataset.v; applyPalette(); save(); render(); buzz(8); toast(PAL[a.dataset.v].name+' theme on'); break;
    case 'clear-sample': { const old=S.tasks.slice(); S.tasks=S.tasks.filter(x=>!x.sample); save(); render('fade'); toast('Examples removed',()=>{S.tasks=old;save();render()}); break; }
    case 'erase': document.getElementById('erase').innerHTML=`<button class="pill-btn" style="color:var(--now)" data-act="erase-yes">Tap again to erase</button>`; break;
    case 'erase-yes': { const old=S.tasks; S.tasks=[]; save(); render('fade'); toast('Everything erased',()=>{S.tasks=old;save();render()}); break; }
    case 'export': { const io=document.getElementById('io'); const data=JSON.stringify({settings:S.settings,tasks:S.tasks}); io.value=data;
      const ok=()=>toast('Backup copied'); try{navigator.clipboard.writeText(data).then(ok,()=>{io.select();toast('Backup shown below. Select and copy it')})}catch(err){io.select();toast('Backup shown below. Select and copy it')} break; }
    case 'import': { try{const d=JSON.parse(document.getElementById('io').value); if(!Array.isArray(d.tasks))throw 0; S.tasks=d.tasks; S.tasks.forEach(t=>{const i=OLD_COLORS.indexOf(t.color);if(i>=0)t.color=COLORS[i]});
S.settings=Object.assign(S.settings,d.settings||{}); applyTheme(); save(); render('fade'); toast(`Restored ${d.tasks.length} tasks`)}
      catch(err){toast('That doesn’t look like a Glassday backup')} break; }
    case 'f-close': closeFocus(); render(); break;
    case 'f-toggle': F.run?(stopFocus(),drawFocus()):startFocus(); buzz(8); break;
    case 'f-plus': F.left+=300; F.total+=300; if(F.run) F.endAt+=300000; drawFocus(); break;
    case 'f-done': { const tk=byId(F.id); if(tk){ if(tk.ext) S.doneN[tk.series+'|'+tk.date]=true; else {const k=tk.date?sel:'inbox'; tk.done={...tk.done,[k]:true}} save()} const b=focusEl.querySelector('.fr'); burst(b,F.color); buzz([10,30,15]); setTimeout(()=>{closeFocus();render()},450); break; }
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='smart-form'){const v=document.getElementById('smart-in').value.trim(); if(!v)return; parsed=parse(v); document.getElementById('pv').innerHTML=pvHtml(parsed); buzz(5)}
  if(e.target.id==='inbox-form'){const inp=document.getElementById('inbox-in'), v=inp.value.trim(); if(!v)return; const nt=commitParsed(parse(v)); render(); const i2=document.getElementById('inbox-in'); i2&&i2.focus();
    toast(nt.allDay?`Added all-day · ${fmtRange(nt.date,nt.endDate)}`:nt.date?`Scheduled ${DN[dow(nt.date)]} ${fT(nt.start)}`:'Added to Inbox',nt.pend?null:()=>{S.tasks=S.tasks.filter(x=>x!==nt);save();render()})}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='smart-in'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('smart-form').requestSubmit()}
  if(e.key==='Escape'){ if(focusEl.classList.contains('open'))closeFocus(); else closeSheet() }
});
document.addEventListener('input',e=>{
  if(!sheet.contains(e.target))return; const id=e.target.id;
  if(id==='f-time') setDur(+document.getElementById('f-dur').value,'start');
  else if(id==='f-end'){const st=readTime('f-time'), en=readTime('f-end'); if(st!=null&&en!=null){let d=en-st; if(d<=0)d+=1440; setDur(d,'end')}}
  else if(id==='f-adate'){const ae=document.getElementById('f-aend'); ae.min=e.target.value; if(!ae.value||ae.value<e.target.value) ae.value=e.target.value; checkWarn()}
  else if(id==='f-date'||id==='f-aend') checkWarn();
});
document.addEventListener('change',e=>{
  if(e.target.id==='ds'){S.settings.dayStart=+e.target.value;save();toast('Day start updated')}
  if(e.target.id==='de'){S.settings.dayEnd=+e.target.value;save();toast('Day end updated')}
  if(e.target.id==='calsel'){S.settings.calId=e.target.value;save();toast('New events will go to this calendar')}
});

/* swipe: timeline/week change day, strip changes week, sheet drag to close */
let sx=0,sy=0,sTarget=null;
document.addEventListener('touchstart',e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;sTarget=e.target},{passive:true});
document.addEventListener('touchend',e=>{
  const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dy)>45||!sTarget||!sTarget.closest)return;
  if(sTarget.closest('#strip')) setDay(addD(sel,dx<0?7:-7));
  else if(sTarget.closest('#view')&&view==='week'&&calMode!=='week') calStep(dx<0?1:-1);
  else if(sTarget.closest('#view')&&(view==='timeline'||view==='week')&&!sTarget.closest('.quick')) setDay(addD(sel,(dx<0?1:-1)*(view==='week'?7:1)));
},{passive:true});

/* sheet: drag the top bar to dismiss; nothing else moves the panel */
let gy=null, gdy=0;
sheet.addEventListener('touchstart',e=>{ if(e.target.closest('#grab')){gy=e.touches[0].clientY;gdy=0;sheet.classList.add('dragging')} },{passive:true});
sheet.addEventListener('touchmove',e=>{ if(gy==null)return; gdy=Math.max(0,e.touches[0].clientY-gy); sheet.style.transform=`translateY(${gdy}px)`; e.preventDefault() },{passive:false});
sheet.addEventListener('touchend',()=>{ if(gy==null)return; gy=null; sheet.classList.remove('dragging');
  if(gdy>110) closeSheet(); else sheet.style.transform=''; });
// stop the page behind (and the panel itself) from rubber-banding; only the panel's middle scrolls
document.addEventListener('touchmove',e=>{
  if(!sheet.classList.contains('open')&&!document.getElementById('focus').classList.contains('open'))return;
  const t=e.target;
  if(t.closest&&(t.closest('.sheet-body')||t.closest('.pick')||t.closest('#grab')))return;
  e.preventDefault();
},{passive:false});
// keep the panel above the keyboard and the focused field in view
let nativeKb=false;
function setKb(px){ const k=px>80?Math.round(px):0; document.documentElement.style.setProperty('--kb',k+'px'); document.documentElement.classList.toggle('kb',k>0); if(window.scrollY)window.scrollTo(0,0) }
window.GDkb=px=>{nativeKb=true;setKb(px/(window.GDZ||1))};   // points -> CSS px when zoomed for Dynamic Type
const vv=window.visualViewport;
if(vv){const onVV=()=>{ if(!nativeKb) setKb(window.innerHeight-vv.height-vv.offsetTop) }; vv.addEventListener('resize',onVV); vv.addEventListener('scroll',onVV)}
sheet.addEventListener('focusin',e=>{ const el=e.target; if(!el.matches('input,textarea,select'))return;
  setTimeout(()=>{ const b=document.getElementById('sheet-body'); if(!b||!b.contains(el))return; const r=el.getBoundingClientRect(), br=b.getBoundingClientRect();
    if(r.bottom>br.bottom-12||r.top<br.top) b.scrollBy({top:r.top-br.top-br.height/3,behavior:reduce?'auto':'smooth'}) },320) });

/* live clock refresh */
setInterval(()=>{ if(!sheet.classList.contains('open')&&(view==='timeline'||view==='week')&&sel===today()) render() },30000);
document.addEventListener('visibilitychange',()=>{
  // native drops keep-awake when the app goes to the background; ask again if focus is still running
  if(!document.hidden&&F.run){ if(NATIVE) post({type:'awake',on:true}); tickFocus() }
  if(!document.hidden&&!sheet.classList.contains('open')) render() });

applyTheme(); render('fade'); setTimeout(scrollToNow,120);
(()=>{ const sp=document.getElementById('splash'); if(!sp)return; let done=false;
  const leave=()=>{ if(done)return; done=true; sp.classList.add('out');
    const app=document.getElementById('app'), dock=document.querySelector('.dock');
    [app,dock].forEach(x=>{x.classList.remove('entering');void x.offsetWidth;x.classList.add('entering')});
    render('fade'); setTimeout(scrollToNow,120); buzz(6);
    setTimeout(()=>{sp.remove();[app,dock].forEach(x=>x.classList.remove('entering'))},800) };
  sp.addEventListener('click',leave);
  setTimeout(leave, reduce?250:2300);
})();
if(NATIVE){post({type:'ready'}); post({type:'status'})}
})();
</script>
